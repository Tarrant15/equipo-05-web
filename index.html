<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipo NN</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1> Equipo Plus Ultra</h1>
    <h1> Equipo 7</h1>
    <nav>
      <ul>
        <li><a href="#equipo">El equipo</a></li>
        <li><a href="#proyecto">El proyecto</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <form action="/guardar-jugador" method="POST">
    <h2>Registro de Jugador de Fútbol</h2>

    <!-- Datos Personales -->
    <div>
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>

    <div>
        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
    </div>

    <!-- Datos Deportivos -->
    <div>
        <label for="posicion">Posición en el Campo:</label>
        <select id="posicion" name="posicion" required>
            <option value="">Selecciona una posición</option>
            <option value="portero">Portero</option>
            <option value="defensa">Defensa</option>
            <option value="centrocampista">Centrocampista</option>
            <option value="delantero">Delantero</option>
        </select>
    </div>

    <div>
        <label for="dorsal">Número de Camiseta (Dorsal):</label>
        <input type="number" id="dorsal" name="dorsal" min="1" max="99">
    </div>

    <div>
        <label for="pie_dominante">Pie Dominante:</label>
        <select id="pie_dominante" name="pie_dominante">
            <option value="derecho">Derecho</option>
            <option value="izquierdo">Izquierdo</option>
            <option value="ambidiestro">Ambidiestro</option>
        </select>
    </div>

    <!-- Botón de Envío -->
    <div>
        <button type="submit">Registrar Jugador</button>
    </div>
</form>

  </main>
  <footer id="contacto">
    <p>Escríbe</p>
  </footer>

</body>
</html>
