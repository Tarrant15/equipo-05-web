<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipo NN</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Issue #1 · Cabecera con el nombre del equipo y menú de navegación -->
  <header>
    <h1>Nombre del equipo</h1>
    <nav>
      <ul>
        <li><a href="#equipo">El equipo</a></li>
        <li><a href="#proyecto">El proyecto</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- Issue #2 · Sección de presentación de cada miembro.
         Copiad el <article> una vez por persona y completadlo. -->
    <section id="equipo">
      <h2>El equipo</h2>

      <article class="miembro">
        <h3>Nombre y apellidos</h3>
        <p class="rol">Rol en el equipo</p>
        <p>Una o dos frases sobre qué te interesa del desarrollo web.</p>
      </article>

    </section>

    <section id="proyecto">
      <h2>El proyecto</h2>
      <p>Una descripción breve de lo que hace vuestra página.</p>
    </section>

  </main>

  <!-- Issue #3 · Pie de página con contacto -->
  <footer id="contacto">
    <p>Escríbenos a equipo-NN@example.com</p>
  </footer>

</body>
</html>
